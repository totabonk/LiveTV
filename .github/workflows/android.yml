name: Build Live TV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o *.zip
          find . -name gradlew -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-debug
          path: "**/build/outputs/apk/**/*.apk"
